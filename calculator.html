<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="style.css">
   
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
     <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">
</head>
<body >
<div class="caculator">
   <div class="container">
    <input type="text" name="screen" id="scrn">
   </div> 
    <div class="btns">
    <div class="row1">
    <button class="numbr" id="clear">AC</button>
     <button class="numbr" id="modulus">%</button>
    <button class="numbr" id="backspace">X</button>
    <button class="numbr"  id="div">/</button>
    
</div>
<div class="row2">
 <button class="numbr" id="seven">7</button>
 <button class="numbr" id="eight">8</button>
 <button class="numbr" id="nine">9</button>
 <button class="numbr" id="sub">-</button>
   
</div>
<div class="row3">
 <button class="numbr" id="four">4</button>
 <button class="numbr" id="five">5</button>
 <button class="numbr" id="six">6</button>
 <button class="numbr" id="addition">+</button>
   
</div>
<div class="row4">
 <button class="numbr" id="one">1</button>
 <button class="numbr" id="two">2</button>
 <button class="numbr" id="three">3</button>
 <button class="numbr" id="mul">*</button>
</div>
<div class="row4">
 <button class="numbr" id="keyboard">00</button>
 <button class="numbr" id="zero">0</button>
 <button class="numbr" id="decimal">.</button>
 <button class="numbr" id="equal">=</button>
</div>
</div>
   </div>
</body>

    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
   <script src="script.js" defer=""></script>
</body>
</html>
